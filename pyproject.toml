[project]
name = "dsproject-a-to-z"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gdown>=5.2.0",
    "icecream>=2.1.4",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "lightgbm>=4.6.0",
    "mlflow>=2.22.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "scikit-learn>=1.6.1",
    "typer>=0.15.3",
    "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["F401", "E501"]
exclude = [".vscode", ".venv", "tests/*"]
